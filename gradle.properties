version=0.1.0

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.unsafe.isolated-projects=true

org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

kotlin.stdlib.default.dependency=false

# The IntelliJ Platform Gradle Plugin resolves the IDE distribution eagerly; keep its
# noisy self-update check off so configuration stays cacheable.
org.jetbrains.intellij.platform.selfUpdateCheck=false
